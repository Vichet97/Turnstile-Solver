services:
  turnstile-solver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: turnstile-solver
    user: "0:0"
    ports:
      - "5510:5000"
      - "3333:3389"
    environment:
      - PYTHONUNBUFFERED=1
      - DISPLAY=:99
      - RUN_API_SOLVER=true
      - ENABLE_RDP_WITH_API=true
      - SOLVER_DISPLAY_MODE=auto
      - RDP_SESSION_WAIT_SECONDS=15
      - SOLVER_BROWSER_TYPE=chromium
      - SOLVER_THREAD=1
      - SELENIUMBASE_PREWARM=true
      - SELENIUMBASE_PREFETCH_DRIVER=true
      - SELENIUMBASE_UC=false
      - SELENIUMBASE_GUI_CLICK=false
      - XRDP_PASSWORD=016997791aA!!
      - XVFB_SCREEN_WIDTH=1920
      - XVFB_SCREEN_HEIGHT=1080
      - XVFB_SCREEN_DEPTH=24
      - XVFB_DPI=96
      - SOLVER_VIEWPORT_WIDTH=1920
      - SOLVER_VIEWPORT_HEIGHT=1080
      - SOLVER_DEVICE_SCALE_FACTOR=1.0
    volumes:
      # Optional: Mount logs directory for persistence
      - ./logs:/app/logs
    restart: unless-stopped
    # Add shared memory size for browser stability
    shm_size: 2gb
    # Security options for X11 and browsers
    security_opt:
      - seccomp:unconfined
    # Add privileges for X11
    privileged: false
    tmpfs:
      - /tmp/.X11-unix:rw,noexec,nosuid,size=100k
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
